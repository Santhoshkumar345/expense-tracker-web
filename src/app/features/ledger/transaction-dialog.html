<h2 mat-dialog-title>{{ isEdit ? 'Edit transaction' : 'Add transaction' }}</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content>
    <mat-button-toggle-group formControlName="type" class="full-width type-toggle">
      <mat-button-toggle value="Expense">Expense</mat-button-toggle>
      <mat-button-toggle value="Income">Income</mat-button-toggle>
    </mat-button-toggle-group>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Date</mat-label>
      <input matInput [matDatepicker]="picker" formControlName="date" />
      <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Amount</mat-label>
      <input matInput type="number" step="0.01" formControlName="amount" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Category</mat-label>
      <mat-select formControlName="categoryId">
        @for (c of filteredCategories; track c.id) {
          <mat-option [value]="c.id">{{ c.name }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    @if (subCategories.length) {
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Sub-category</mat-label>
        <mat-select formControlName="subCategoryId">
          <mat-option [value]="null">None</mat-option>
          @for (s of subCategories; track s.id) {
            <mat-option [value]="s.id">{{ s.name }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    }

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Payment method</mat-label>
      <input matInput formControlName="paymentMethod" placeholder="Cash, Card, UPI..." />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Note</mat-label>
      <input matInput formControlName="note" />
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancel</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid">
      {{ isEdit ? 'Save' : 'Add' }}
    </button>
  </mat-dialog-actions>
</form>
