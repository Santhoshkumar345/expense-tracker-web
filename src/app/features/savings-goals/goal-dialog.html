<h2 mat-dialog-title>{{ isEdit ? 'Edit goal' : 'New savings goal' }}</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" placeholder="Vacation, Emergency fund..." />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Target amount</mat-label>
      <input matInput type="number" step="0.01" formControlName="targetAmount" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Target date (optional)</mat-label>
      <input matInput [matDatepicker]="picker" formControlName="targetDate" />
      <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancel</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid">
      {{ isEdit ? 'Save' : 'Create' }}
    </button>
  </mat-dialog-actions>
</form>
